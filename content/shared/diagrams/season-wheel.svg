<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="{{aria}}">
<!-- four seasonal sectors, clockwise from top-right (s1..s4) -->
<path d="M320,190 L320,30 A160,160 0 0 1 480,190 Z" fill="var(--mint)" stroke="var(--line)" stroke-width="1.5"/>
<path d="M320,190 L480,190 A160,160 0 0 1 320,350 Z" fill="var(--sage)" opacity="0.30" stroke="var(--line)" stroke-width="1.5"/>
<path d="M320,190 L320,350 A160,160 0 0 1 160,190 Z" fill="var(--clay)" opacity="0.22" stroke="var(--line)" stroke-width="1.5"/>
<path d="M320,190 L160,190 A160,160 0 0 1 320,30 Z" fill="var(--sand-2)" stroke="var(--line)" stroke-width="1.5"/>
<!-- twelve light month ticks -->
<line x1="320" y1="30" x2="320" y2="40" stroke="var(--muted)" stroke-width="1.5"/>
<line x1="400" y1="51.4" x2="395" y2="60.1" stroke="var(--muted)" stroke-width="1.5"/>
<line x1="458.6" y1="110" x2="449.9" y2="115" stroke="var(--muted)" stroke-width="1.5"/>
<line x1="480" y1="190" x2="470" y2="190" stroke="var(--muted)" stroke-width="1.5"/>
<line x1="458.6" y1="270" x2="449.9" y2="265" stroke="var(--muted)" stroke-width="1.5"/>
<line x1="400" y1="328.6" x2="395" y2="319.9" stroke="var(--muted)" stroke-width="1.5"/>
<line x1="320" y1="350" x2="320" y2="340" stroke="var(--muted)" stroke-width="1.5"/>
<line x1="240" y1="328.6" x2="245" y2="319.9" stroke="var(--muted)" stroke-width="1.5"/>
<line x1="181.4" y1="270" x2="190.1" y2="265" stroke="var(--muted)" stroke-width="1.5"/>
<line x1="160" y1="190" x2="170" y2="190" stroke="var(--muted)" stroke-width="1.5"/>
<line x1="181.4" y1="110" x2="190.1" y2="115" stroke="var(--muted)" stroke-width="1.5"/>
<line x1="240" y1="51.4" x2="245" y2="60.1" stroke="var(--muted)" stroke-width="1.5"/>
<!-- season names + one observation each -->
<text x="394" y="106" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">{{s1}}</text>
<text x="394" y="124" text-anchor="middle" font-size="11" fill="var(--muted)">{{o1}}</text>
<text x="394" y="262" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">{{s2}}</text>
<text x="394" y="280" text-anchor="middle" font-size="11" fill="var(--muted)">{{o2}}</text>
<text x="246" y="262" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">{{s3}}</text>
<text x="246" y="280" text-anchor="middle" font-size="11" fill="var(--muted)">{{o3}}</text>
<text x="246" y="106" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">{{s4}}</text>
<text x="246" y="124" text-anchor="middle" font-size="11" fill="var(--muted)">{{o4}}</text>
<!-- the plant at the center -->
<circle cx="320" cy="190" r="58" fill="var(--sage)" stroke="var(--line)" stroke-width="1.5"/>
<text x="320" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="var(--on-accent)">{{c1}}</text>
<!-- takeaway -->
<text x="320" y="388" text-anchor="middle" font-size="12" font-style="italic" fill="var(--muted)">{{note}}</text>
</svg>
