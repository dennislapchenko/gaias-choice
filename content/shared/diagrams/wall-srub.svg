<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="{{aria}}">
<text x="320" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">{{t1}}</text>
<!-- long-wall courses (elevation); odd courses run proud past the corner crossing -->
<rect x="196" y="54" width="240" height="22" rx="11" fill="var(--sand-2)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="196" y="106" width="240" height="22" rx="11" fill="var(--sand-2)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="196" y="158" width="240" height="22" rx="11" fill="var(--sand-2)" stroke="var(--line)" stroke-width="1.5"/>
<!-- even courses stop at the crossing; the cross-wall log ends face the viewer -->
<rect x="196" y="80" width="188" height="22" rx="11" fill="var(--sand-2)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="196" y="132" width="188" height="22" rx="11" fill="var(--sand-2)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="196" y="184" width="188" height="22" rx="11" fill="var(--sand-2)" stroke="var(--line)" stroke-width="1.5"/>
<!-- groove line under each course (паз) -->
<line x1="206" y1="78" x2="372" y2="78" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="206" y1="104" x2="372" y2="104" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="206" y1="130" x2="372" y2="130" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="206" y1="156" x2="372" y2="156" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="206" y1="182" x2="372" y2="182" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4"/>
<!-- cross-wall log ends at the corner: end grain rings, grooved underside -->
<circle cx="400" cy="91" r="12" fill="var(--sand-2)" stroke="var(--ink)" stroke-width="2"/>
<circle cx="400" cy="91" r="5" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
<path d="M390,98 Q400,89 410,98" fill="none" stroke="var(--ink)" stroke-width="1.8"/>
<circle cx="400" cy="143" r="12" fill="var(--sand-2)" stroke="var(--ink)" stroke-width="2"/>
<circle cx="400" cy="143" r="5" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
<path d="M390,150 Q400,141 410,150" fill="none" stroke="var(--ink)" stroke-width="1.8"/>
<circle cx="400" cy="195" r="12" fill="var(--sand-2)" stroke="var(--ink)" stroke-width="2"/>
<circle cx="400" cy="195" r="5" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
<path d="M390,202 Q400,193 410,202" fill="none" stroke="var(--ink)" stroke-width="1.8"/>
<!-- callouts -->
<line x1="456" y1="64" x2="414" y2="84" stroke="var(--line)" stroke-width="1.5"/>
<text x="460" y="68" text-anchor="start" font-size="11.5" fill="var(--ink)">{{p1}}</text>
<line x1="184" y1="130" x2="204" y2="130" stroke="var(--line)" stroke-width="1.5"/>
<text x="180" y="134" text-anchor="end" font-size="11.5" fill="var(--ink)">{{p2}}</text>
<line x1="456" y1="168" x2="440" y2="169" stroke="var(--line)" stroke-width="1.5"/>
<text x="460" y="172" text-anchor="start" font-size="11.5" fill="var(--ink)">{{p3}}</text>
<!-- takeaway -->
<text x="320" y="248" text-anchor="middle" font-size="12" font-style="italic" fill="var(--muted)">{{note}}</text>
</svg>
