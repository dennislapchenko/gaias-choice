<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="{{aria}}">
<!-- ground + as-built datum -->
<line x1="40" y1="336" x2="612" y2="336" stroke="var(--line)" stroke-width="2"/>
<line x1="60" y1="76" x2="610" y2="76" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.8"/>
<!-- LEFT wall: as built -->
<rect x="70" y="76" width="170" height="260" fill="var(--mint)" stroke="var(--line)" stroke-width="2"/>
<line x1="70" y1="102" x2="240" y2="102" stroke="var(--line)" stroke-width="1" opacity="0.6"/>
<line x1="70" y1="128" x2="240" y2="128" stroke="var(--line)" stroke-width="1" opacity="0.6"/>
<line x1="70" y1="154" x2="240" y2="154" stroke="var(--line)" stroke-width="1" opacity="0.6"/>
<line x1="70" y1="180" x2="240" y2="180" stroke="var(--line)" stroke-width="1" opacity="0.6"/>
<line x1="70" y1="206" x2="240" y2="206" stroke="var(--line)" stroke-width="1" opacity="0.6"/>
<line x1="70" y1="232" x2="240" y2="232" stroke="var(--line)" stroke-width="1" opacity="0.6"/>
<line x1="70" y1="258" x2="240" y2="258" stroke="var(--line)" stroke-width="1" opacity="0.6"/>
<line x1="70" y1="284" x2="240" y2="284" stroke="var(--line)" stroke-width="1" opacity="0.6"/>
<line x1="70" y1="310" x2="240" y2="310" stroke="var(--line)" stroke-width="1" opacity="0.6"/>
<!-- open settling gap + sliding-surround window -->
<rect x="105" y="102" width="100" height="26" fill="var(--sand-2)" stroke="var(--clay)" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M112 115 Q124 107 136 115 T160 115 T184 115 T198 115" fill="none" stroke="var(--clay)" stroke-width="3"/>
<rect x="105" y="128" width="100" height="90" fill="var(--sand-2)" stroke="var(--ink)" stroke-width="2.5"/>
<line x1="150" y1="48" x2="150" y2="100" stroke="var(--line)" stroke-width="1.5"/>
<text x="150" y="40" text-anchor="middle" font-size="12" fill="var(--ink)">{{gap}}</text>
<!-- RIGHT wall: after the settling years, sunk below the datum -->
<rect x="350" y="98" width="150" height="238" fill="var(--mint)" stroke="var(--line)" stroke-width="2"/>
<line x1="350" y1="122" x2="500" y2="122" stroke="var(--line)" stroke-width="1" opacity="0.6"/>
<line x1="350" y1="146" x2="500" y2="146" stroke="var(--line)" stroke-width="1" opacity="0.6"/>
<line x1="350" y1="170" x2="500" y2="170" stroke="var(--line)" stroke-width="1" opacity="0.6"/>
<line x1="350" y1="193" x2="500" y2="193" stroke="var(--line)" stroke-width="1" opacity="0.6"/>
<line x1="350" y1="217" x2="500" y2="217" stroke="var(--line)" stroke-width="1" opacity="0.6"/>
<line x1="350" y1="241" x2="500" y2="241" stroke="var(--line)" stroke-width="1" opacity="0.6"/>
<line x1="350" y1="265" x2="500" y2="265" stroke="var(--line)" stroke-width="1" opacity="0.6"/>
<line x1="350" y1="288" x2="500" y2="288" stroke="var(--line)" stroke-width="1" opacity="0.6"/>
<line x1="350" y1="312" x2="500" y2="312" stroke="var(--line)" stroke-width="1" opacity="0.6"/>
<!-- gap nearly closed, packing compressed -->
<rect x="375" y="120" width="100" height="10" fill="var(--sand-2)" stroke="var(--clay)" stroke-width="1.5" stroke-dasharray="3 3"/>
<path d="M382 125 Q392 122 402 125 T422 125 T442 125 T462 125" fill="none" stroke="var(--clay)" stroke-width="2.5"/>
<rect x="375" y="130" width="100" height="90" fill="var(--sand-2)" stroke="var(--ink)" stroke-width="2.5"/>
<!-- the drop: datum to sunk wall top -->
<line x1="330" y1="76" x2="330" y2="98" stroke="var(--clay)" stroke-width="2"/>
<polygon points="326,82 334,82 330,76" fill="var(--clay)"/>
<polygon points="326,92 334,92 330,98" fill="var(--clay)"/>
<line x1="322" y1="98" x2="338" y2="98" stroke="var(--clay)" stroke-width="2"/>
<text x="300" y="60" text-anchor="middle" font-size="12" fill="var(--ink)">{{drop}}</text>
<!-- interior post on an adjustable jack -->
<rect x="515" y="118" width="60" height="12" fill="var(--sand-2)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="539" y="130" width="12" height="168" fill="var(--sand-2)" stroke="var(--line)" stroke-width="1.5"/>
<line x1="545" y1="298" x2="545" y2="324" stroke="var(--ink)" stroke-width="3"/>
<line x1="538" y1="304" x2="552" y2="304" stroke="var(--ink)" stroke-width="1.5"/>
<line x1="538" y1="310" x2="552" y2="310" stroke="var(--ink)" stroke-width="1.5"/>
<line x1="538" y1="316" x2="552" y2="316" stroke="var(--ink)" stroke-width="1.5"/>
<rect x="527" y="324" width="36" height="12" fill="var(--sand-2)" stroke="var(--line)" stroke-width="1.5"/>
<line x1="568" y1="150" x2="568" y2="186" stroke="var(--clay)" stroke-width="2"/>
<polygon points="564,184 572,184 568,196" fill="var(--clay)"/>
<line x1="545" y1="96" x2="544" y2="114" stroke="var(--line)" stroke-width="1.5"/>
<text x="545" y="90" text-anchor="middle" font-size="12" fill="var(--ink)">{{jack}}</text>
<!-- panel labels + takeaway -->
<text x="155" y="362" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">{{t1}}</text>
<text x="425" y="362" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">{{t2}}</text>
<text x="320" y="390" text-anchor="middle" font-size="12" font-style="italic" fill="var(--muted)">{{note}}</text>
</svg>
