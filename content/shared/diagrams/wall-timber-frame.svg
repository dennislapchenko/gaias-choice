<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="{{aria}}">
<text x="320" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">{{t1}}</text>
<!-- ground -->
<line x1="180" y1="212" x2="462" y2="212" stroke="var(--line)" stroke-width="2"/>
<!-- infill panel between the posts: light, dashed — it carries nothing -->
<rect x="238" y="76" width="166" height="104" fill="var(--sand-2)" opacity="0.55" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="262" y1="174" x2="330" y2="84" stroke="var(--muted)" stroke-width="1" opacity="0.4"/>
<line x1="306" y1="174" x2="374" y2="84" stroke="var(--muted)" stroke-width="1" opacity="0.4"/>
<!-- the skeleton: few, large members, drawn heavy -->
<rect x="198" y="52" width="246" height="18" fill="var(--sage)"/>
<rect x="210" y="70" width="22" height="116" fill="var(--sage)"/>
<rect x="410" y="70" width="22" height="116" fill="var(--sage)"/>
<rect x="198" y="186" width="246" height="14" fill="var(--sage)"/>
<!-- corner braces -->
<line x1="238" y1="150" x2="300" y2="74" stroke="var(--sage)" stroke-width="12"/>
<line x1="404" y1="150" x2="342" y2="74" stroke="var(--sage)" stroke-width="12"/>
<!-- callouts -->
<line x1="180" y1="60" x2="196" y2="60" stroke="var(--line)" stroke-width="1.5"/>
<text x="176" y="64" text-anchor="end" font-size="11.5" fill="var(--ink)">{{p2}}</text>
<line x1="180" y1="116" x2="208" y2="118" stroke="var(--line)" stroke-width="1.5"/>
<text x="176" y="120" text-anchor="end" font-size="11.5" fill="var(--ink)">{{p1}}</text>
<line x1="464" y1="116" x2="382" y2="118" stroke="var(--line)" stroke-width="1.5"/>
<text x="468" y="120" text-anchor="start" font-size="11.5" fill="var(--ink)">{{p3}}</text>
<!-- takeaway -->
<text x="320" y="248" text-anchor="middle" font-size="12" font-style="italic" fill="var(--muted)">{{note}}</text>
</svg>
