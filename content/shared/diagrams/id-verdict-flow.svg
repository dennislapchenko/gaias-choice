<svg viewBox="0 0 640 344" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="{{aria}}">
<defs><marker id="arr-ivf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
<!-- five steps top to bottom; step 4 (the look-alike check) is the safety accent -->
<rect x="140" y="18" width="380" height="42" rx="10" fill="var(--sand-2)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="140" y="78" width="380" height="42" rx="10" fill="var(--sand-2)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="140" y="138" width="380" height="42" rx="10" fill="var(--sand-2)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="140" y="198" width="380" height="42" rx="10" fill="var(--clay)"/>
<rect x="140" y="258" width="380" height="42" rx="10" fill="var(--sand-2)" stroke="var(--line)" stroke-width="1.5"/>
<!-- connecting arrows -->
<line x1="330" y1="62" x2="330" y2="74" stroke="var(--muted)" stroke-width="2" marker-end="url(#arr-ivf)"/>
<line x1="330" y1="122" x2="330" y2="134" stroke="var(--muted)" stroke-width="2" marker-end="url(#arr-ivf)"/>
<line x1="330" y1="182" x2="330" y2="194" stroke="var(--muted)" stroke-width="2" marker-end="url(#arr-ivf)"/>
<line x1="330" y1="242" x2="330" y2="254" stroke="var(--muted)" stroke-width="2" marker-end="url(#arr-ivf)"/>
<!-- step numbers -->
<circle cx="140" cy="39" r="11" fill="var(--sage)"/><text x="140" y="43" text-anchor="middle" font-size="11" font-weight="700" fill="var(--on-accent)">1</text>
<circle cx="140" cy="99" r="11" fill="var(--sage)"/><text x="140" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="var(--on-accent)">2</text>
<circle cx="140" cy="159" r="11" fill="var(--sage)"/><text x="140" y="163" text-anchor="middle" font-size="11" font-weight="700" fill="var(--on-accent)">3</text>
<circle cx="140" cy="219" r="11" fill="var(--sage)"/><text x="140" y="223" text-anchor="middle" font-size="11" font-weight="700" fill="var(--on-accent)">4</text>
<circle cx="140" cy="279" r="11" fill="var(--sage)"/><text x="140" y="283" text-anchor="middle" font-size="11" font-weight="700" fill="var(--on-accent)">5</text>
<!-- step texts -->
<text x="338" y="43" text-anchor="middle" font-size="12.5" fill="var(--ink)">{{s1}}</text>
<text x="338" y="103" text-anchor="middle" font-size="12.5" fill="var(--ink)">{{s2}}</text>
<text x="338" y="163" text-anchor="middle" font-size="12.5" fill="var(--ink)">{{s3}}</text>
<text x="338" y="223" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--on-accent)">{{s4}}</text>
<text x="338" y="283" text-anchor="middle" font-size="12.5" fill="var(--ink)">{{s5}}</text>
<!-- takeaway -->
<text x="320" y="332" text-anchor="middle" font-size="12" font-style="italic" fill="var(--muted)">{{note}}</text>
</svg>
