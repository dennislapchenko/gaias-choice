<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="{{aria}}">
<text x="320" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">{{t1}}</text>
<!-- stem + leaf -->
<line x1="218" y1="160" x2="218" y2="232" stroke="var(--sage)" stroke-width="3"/>
<path d="M218,200 C202,192 188,194 180,202 C189,210 204,208 218,200 Z" fill="var(--mint)" stroke="var(--sage)" stroke-width="1.5"/>
<!-- the head: ray "petals" around a disc -->
<g fill="var(--sand-2)" stroke="var(--line)" stroke-width="1">
<ellipse cx="258" cy="130" rx="20" ry="7"/>
<ellipse cx="258" cy="130" rx="20" ry="7" transform="rotate(30 218 130)"/>
<ellipse cx="258" cy="130" rx="20" ry="7" transform="rotate(60 218 130)"/>
<ellipse cx="258" cy="130" rx="20" ry="7" transform="rotate(90 218 130)"/>
<ellipse cx="258" cy="130" rx="20" ry="7" transform="rotate(120 218 130)"/>
<ellipse cx="258" cy="130" rx="20" ry="7" transform="rotate(150 218 130)"/>
<ellipse cx="258" cy="130" rx="20" ry="7" transform="rotate(180 218 130)"/>
<ellipse cx="258" cy="130" rx="20" ry="7" transform="rotate(210 218 130)"/>
<ellipse cx="258" cy="130" rx="20" ry="7" transform="rotate(240 218 130)"/>
<ellipse cx="258" cy="130" rx="20" ry="7" transform="rotate(270 218 130)"/>
<ellipse cx="258" cy="130" rx="20" ry="7" transform="rotate(300 218 130)"/>
<ellipse cx="258" cy="130" rx="20" ry="7" transform="rotate(330 218 130)"/>
</g>
<circle cx="218" cy="130" r="24" fill="var(--clay)"/>
<!-- zoom out to the truth: many tiny florets -->
<line x1="240" y1="118" x2="404" y2="100" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="240" y1="144" x2="404" y2="158" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="452" cy="128" r="52" fill="var(--sand-2)" opacity="0.5" stroke="var(--muted)" stroke-width="2" stroke-dasharray="6 5"/>
<!-- disc florets: each a tiny flower -->
<g fill="var(--clay)" stroke="var(--ink)" stroke-width="0.75">
<circle cx="446" cy="112" r="4"/><circle cx="458" cy="110" r="4"/><circle cx="470" cy="116" r="4"/>
<circle cx="440" cy="124" r="4"/><circle cx="452" cy="124" r="4"/><circle cx="464" cy="128" r="4"/><circle cx="476" cy="130" r="4"/>
<circle cx="444" cy="138" r="4"/><circle cx="456" cy="140" r="4"/><circle cx="468" cy="144" r="4"/>
<circle cx="450" cy="152" r="4"/>
</g>
<!-- ray florets: strap-shaped, at the head's edge -->
<g fill="var(--sand-2)" stroke="var(--line)" stroke-width="1">
<ellipse cx="420" cy="106" rx="15" ry="5" transform="rotate(-30 420 106)"/>
<ellipse cx="413" cy="128" rx="15" ry="5"/>
<ellipse cx="420" cy="150" rx="15" ry="5" transform="rotate(30 420 150)"/>
</g>
<!-- callouts -->
<line x1="154" y1="82" x2="192" y2="102" stroke="var(--line)" stroke-width="1.5"/>
<text x="150" y="80" text-anchor="end" font-size="11.5" fill="var(--ink)">{{p1}}</text>
<line x1="154" y1="158" x2="196" y2="140" stroke="var(--line)" stroke-width="1.5"/>
<text x="150" y="162" text-anchor="end" font-size="11.5" fill="var(--ink)">{{p2}}</text>
<line x1="452" y1="184" x2="452" y2="200" stroke="var(--line)" stroke-width="1.5"/>
<text x="452" y="214" text-anchor="middle" font-size="11.5" fill="var(--ink)">{{p3}}</text>
<!-- takeaway -->
<text x="320" y="248" text-anchor="middle" font-size="12" font-style="italic" fill="var(--muted)">{{note}}</text>
</svg>
