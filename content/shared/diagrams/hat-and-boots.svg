<svg viewBox="0 0 640 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="{{aria}}">
<!-- ground line + soil hatches -->
<line x1="20" y1="300" x2="620" y2="300" stroke="var(--line)" stroke-width="2"/>
<line x1="60" y1="312" x2="72" y2="304" stroke="var(--line)" stroke-width="1.5" opacity="0.7"/>
<line x1="100" y1="316" x2="112" y2="308" stroke="var(--line)" stroke-width="1.5" opacity="0.7"/>
<line x1="140" y1="312" x2="152" y2="304" stroke="var(--line)" stroke-width="1.5" opacity="0.7"/>
<line x1="520" y1="316" x2="532" y2="308" stroke="var(--line)" stroke-width="1.5" opacity="0.7"/>
<line x1="560" y1="312" x2="572" y2="304" stroke="var(--line)" stroke-width="1.5" opacity="0.7"/>
<!-- the boots: plinth straddling the ground line, drain beside it -->
<rect x="330" y="278" width="150" height="52" rx="2" fill="var(--sand-2)" stroke="var(--line)" stroke-width="2"/>
<circle cx="316" cy="324" r="6" fill="var(--sand-2)" stroke="var(--line)" stroke-width="1.5"/>
<!-- the wall between -->
<rect x="344" y="182" width="122" height="96" fill="var(--mint)"/>
<rect x="386" y="210" width="38" height="30" fill="var(--sand-2)" stroke="var(--line)" stroke-width="1.5"/>
<!-- the hat: roof with overhangs past the wall -->
<polygon points="308,182 405,102 502,182" fill="var(--sage)"/>
<!-- hat callouts (top-left) -->
<line x1="298" y1="48" x2="398" y2="98" stroke="var(--line)" stroke-width="1.5"/>
<text x="292" y="52" text-anchor="end" font-size="12" fill="var(--ink)">{{h1}}</text>
<line x1="298" y1="84" x2="352" y2="138" stroke="var(--line)" stroke-width="1.5"/>
<text x="292" y="88" text-anchor="end" font-size="12" fill="var(--ink)">{{h2}}</text>
<line x1="298" y1="120" x2="310" y2="178" stroke="var(--line)" stroke-width="1.5"/>
<text x="292" y="124" text-anchor="end" font-size="12" fill="var(--ink)">{{h3}}</text>
<!-- boot callouts (left-bottom) -->
<line x1="298" y1="264" x2="332" y2="282" stroke="var(--line)" stroke-width="1.5"/>
<text x="292" y="268" text-anchor="end" font-size="12" fill="var(--ink)">{{b1}}</text>
<line x1="298" y1="306" x2="326" y2="306" stroke="var(--line)" stroke-width="1.5"/>
<text x="292" y="310" text-anchor="end" font-size="12" fill="var(--ink)">{{b2}}</text>
<line x1="298" y1="344" x2="310" y2="328" stroke="var(--line)" stroke-width="1.5"/>
<text x="292" y="348" text-anchor="end" font-size="12" fill="var(--ink)">{{b3}}</text>
<!-- the wall label (right) -->
<line x1="504" y1="230" x2="470" y2="230" stroke="var(--line)" stroke-width="1.5"/>
<text x="508" y="234" text-anchor="start" font-size="12" fill="var(--ink)">{{wall}}</text>
<!-- takeaway -->
<text x="320" y="382" text-anchor="middle" font-size="12" font-style="italic" fill="var(--muted)">{{note}}</text>
</svg>
