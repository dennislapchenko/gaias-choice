<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="{{aria}}">
<!-- the trail: five rising steps, gate to summit -->
<polyline points="75,200 197,165 319,130 441,95 563,60" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.6"/>
<rect x="16" y="200" width="118" height="40" rx="8" fill="var(--sand-2)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="138" y="165" width="118" height="75" rx="8" fill="var(--sand-2)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="260" y="130" width="118" height="110" rx="8" fill="var(--sand-2)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="382" y="95" width="118" height="145" rx="8" fill="var(--sand-2)" stroke="var(--line)" stroke-width="1.5"/>
<rect x="504" y="60" width="118" height="180" rx="8" fill="var(--sage)" opacity="0.25" stroke="var(--line)" stroke-width="1.5"/>
<!-- chapter dots -->
<circle cx="75" cy="200" r="11" fill="var(--sage)"/><text x="75" y="204" text-anchor="middle" font-size="11" font-weight="700" fill="var(--on-accent)">1</text>
<circle cx="197" cy="165" r="11" fill="var(--sage)"/><text x="197" y="169" text-anchor="middle" font-size="11" font-weight="700" fill="var(--on-accent)">2</text>
<circle cx="319" cy="130" r="11" fill="var(--sage)"/><text x="319" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="var(--on-accent)">3</text>
<circle cx="441" cy="95" r="11" fill="var(--sage)"/><text x="441" y="99" text-anchor="middle" font-size="11" font-weight="700" fill="var(--on-accent)">4</text>
<circle cx="563" cy="60" r="11" fill="var(--sage)"/><text x="563" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="var(--on-accent)">5</text>
<!-- chapter titles above each step -->
<text x="75" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">{{n1}}</text>
<text x="197" y="147" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">{{n2}}</text>
<text x="319" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">{{n3}}</text>
<text x="441" y="77" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">{{n4}}</text>
<text x="563" y="42" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">{{n5}}</text>
<!-- one-phrase per chapter, under the baseline -->
<text x="75" y="258" text-anchor="middle" font-size="11.5" fill="var(--muted)">{{d1}}</text>
<text x="197" y="258" text-anchor="middle" font-size="11.5" fill="var(--muted)">{{d2}}</text>
<text x="319" y="258" text-anchor="middle" font-size="11.5" fill="var(--muted)">{{d3}}</text>
<text x="441" y="258" text-anchor="middle" font-size="11.5" fill="var(--muted)">{{d4}}</text>
<text x="563" y="258" text-anchor="middle" font-size="11.5" fill="var(--muted)">{{d5}}</text>
<!-- stage labels -->
<text x="75" y="284" text-anchor="middle" font-size="12" font-style="italic" fill="var(--muted)">{{gate}}</text>
<text x="319" y="284" text-anchor="middle" font-size="12" font-style="italic" fill="var(--muted)">{{path}}</text>
<text x="563" y="284" text-anchor="middle" font-size="12" font-style="italic" fill="var(--muted)">{{summit}}</text>
</svg>
